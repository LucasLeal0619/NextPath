<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerencie suas informações de carreira no NextPath.">
    <title>NextPath | Perfil Profissional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" href="../assets/img/favicon.svg">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="app-body">
    <aside class="sidebar">
        <a class="sidebar-logo" href="dashboard.html">
            <span class="sidebar-logo-mark"><svg viewBox="0 0 32 44" aria-hidden="true"><path d="M17 0 2 28h14v16l15-29H17z" fill="currentColor"/></svg></span>
            NextPath
        </a>

        <nav aria-label="Menu principal">
            <ul class="sidebar-menu">
                <li><a class="sidebar-link" href="dashboard.html"><i class="bi bi-grid-fill"></i> Dashboard</a></li>
                <li><a class="sidebar-link active" href="perfil.html" aria-current="page"><i class="bi bi-person"></i> Perfil Profissional</a></li>
                <li><a class="sidebar-link" href="habilidades.html"><i class="bi bi-list-ul"></i> Minhas Habilidades</a></li>
                <li><a class="sidebar-link" href="skilltree.html"><i class="bi bi-diagram-3"></i> SkillTree</a></li>
                <li><a class="sidebar-link" href="vagas.html"><i class="bi bi-briefcase"></i> Vagas</a></li>
                <li><a class="sidebar-link" href="detalhes-vaga.html"><i class="bi bi-file-text"></i> Detalhes da Vaga</a></li>
                <li><a class="sidebar-link" href="compatibilidade.html"><i class="bi bi-bullseye"></i> Compatibilidade com a Vaga</a></li>
                <li><a class="sidebar-link" href="gaps.html"><i class="bi bi-bar-chart"></i> Gaps</a></li>
                <li><a class="sidebar-link" href="trilhas.html"><i class="bi bi-bezier2"></i> Trilhas Recomendadas</a></li>
            </ul>
        </nav>

        <button class="sidebar-sair" type="button" id="botao-sair"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </aside>

    <main class="app-main">
        <header class="app-header">
            <div>
                <h1 class="app-title">Perfil Profissional</h1>
                <p class="app-subtitle">Gerencie suas informações de carreira.</p>
            </div>

            <div class="app-header-acoes">
                <button id="botao-editar" class="btn btn-primary btn-np" type="button"><i class="bi bi-pencil"></i> Editar perfil</button>
                <button id="botao-cancelar" class="btn btn-light btn-np" type="button" hidden>Cancelar</button>
                <button id="botao-salvar" class="btn btn-primary btn-np" type="submit" form="perfil-form" hidden><i class="bi bi-check2"></i> Salvar</button>

                <a class="usuario" href="perfil.html" title="Ver perfil">
                    <span class="text-end">
                        <strong id="usuario-nome" class="usuario-nome"></strong>
                        <span id="usuario-cargo" class="usuario-cargo"></span>
                    </span>
                    <span id="usuario-iniciais" class="usuario-avatar"></span>
                </a>
            </div>
        </header>

        <!-- Os campos ficam bloqueados (fieldset disabled) até clicar em "Editar perfil" -->
        <form id="perfil-form" novalidate>
            <fieldset id="perfil-campos" disabled>
                <div class="row g-4">
                    <div class="col-xl-4">
                        <!-- Resumo: atualizado em tempo real enquanto o usuário digita -->
                        <section class="card-np perfil-resumo">
                            <span id="perfil-avatar" class="perfil-avatar"></span>
                            <h2 id="perfil-nome" class="perfil-nome"></h2>
                            <p id="perfil-cargo" class="card-np-subtitle"></p>
                            <span id="perfil-nivel" class="badge-np"></span>

                            <div class="perfil-area">
                                <span class="numero-legenda">Área de atuação</span>
                                <strong id="perfil-area"></strong>
                            </div>

                            <div class="perfil-completo">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="numero-legenda">Perfil completo</span>
                                    <strong id="perfil-completo-texto"></strong>
                                </div>
                                <div class="barra"><div id="perfil-completo-barra" class="barra-preenchida"></div></div>
                            </div>
                        </section>
                    </div>

                    <div class="col-xl-8">
                        <section class="card-np">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label for="campo-nome" class="form-label">Nome completo</label>
                                    <input id="campo-nome" name="nome" class="form-control" type="text" maxlength="80" autocomplete="name">
                                </div>
                                <div class="col-md-6">
                                    <label for="campo-cargo" class="form-label">Cargo atual</label>
                                    <input id="campo-cargo" name="cargoAtual" class="form-control" type="text" maxlength="80" placeholder="Ex.: Estudante de ADS">
                                </div>
                                <div class="col-md-6">
                                    <label for="campo-area" class="form-label">Área de atuação</label>
                                    <select id="campo-area" name="area" class="form-select">
                                        <option value="">Não definida</option>
                                        <option>Back-end</option>
                                        <option>Front-end</option>
                                        <option>Full Stack</option>
                                        <option>Dados</option>
                                        <option>DevOps / Cloud</option>
                                        <option>Mobile</option>
                                        <option>QA / Testes</option>
                                        <option>UX / UI</option>
                                        <option>Segurança da Informação</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="campo-nivel" class="form-label">Nível profissional</label>
                                    <select id="campo-nivel" name="nivel" class="form-select">
                                        <option value="">Não definido</option>
                                        <option>Estagiário</option>
                                        <option>Júnior</option>
                                        <option>Pleno</option>
                                        <option>Sênior</option>
                                        <option>Especialista</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label for="campo-objetivo" class="form-label">Objetivo profissional</label>
                                    <input id="campo-objetivo" name="objetivo" class="form-control" type="text" maxlength="100" placeholder="Ex.: Tornar-se Desenvolvedor Back-end Pleno em 12 meses">
                                </div>
                            </div>
                        </section>
                    </div>

                    <div class="col-12">
                        <section class="card-np">
                            <label for="campo-sobre" class="card-np-title mb-3">Sobre você</label>
                            <textarea id="campo-sobre" name="sobre" class="form-control campo-sobre" maxlength="600" placeholder="Conte um pouco sobre sua experiência, interesses e o que está estudando."></textarea>
                            <div id="perfil-message" class="auth-message" role="status" aria-live="polite"></div>
                        </section>
                    </div>
                </div>
            </fieldset>
        </form>
    </main>

    <!-- Toast para avisos rápidos (usado pelo app.js) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">
            <div class="d-flex">
                <div id="toast-texto" class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/perfil.js"></script>
</body>
</html>
