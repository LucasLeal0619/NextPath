<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visualize sua árvore de competências no NextPath.">
    <title>NextPath | SkillTree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" href="../assets/img/favicon.svg">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="app-body">
    <aside class="sidebar">
        <a class="sidebar-logo" href="dashboard.html">
            <span class="sidebar-logo-mark"><svg viewBox="0 0 32 44" aria-hidden="true"><path d="M17 0 2 28h14v16l15-29H17z" fill="currentColor"/></svg></span>
            NextPath
        </a>

        <nav aria-label="Menu principal">
            <ul class="sidebar-menu">
                <li><a class="sidebar-link" href="dashboard.html"><i class="bi bi-grid-fill"></i> Dashboard</a></li>
                <li><a class="sidebar-link" href="perfil.html"><i class="bi bi-person"></i> Perfil Profissional</a></li>
                <li><a class="sidebar-link" href="habilidades.html"><i class="bi bi-list-ul"></i> Minhas Habilidades</a></li>
                <li><a class="sidebar-link active" href="skilltree.html" aria-current="page"><i class="bi bi-diagram-3"></i> SkillTree</a></li>
                <li><a class="sidebar-link" href="vagas.html"><i class="bi bi-briefcase"></i> Vagas</a></li>
                <li><a class="sidebar-link" href="detalhes-vaga.html"><i class="bi bi-file-text"></i> Detalhes da Vaga</a></li>
                <li><a class="sidebar-link" href="compatibilidade.html"><i class="bi bi-bullseye"></i> Compatibilidade com a Vaga</a></li>
                <li><a class="sidebar-link" href="gaps.html"><i class="bi bi-bar-chart"></i> Gaps</a></li>
                <li><a class="sidebar-link" href="trilhas.html"><i class="bi bi-bezier2"></i> Trilhas Recomendadas</a></li>
            </ul>
        </nav>

        <button class="sidebar-sair" type="button" id="botao-sair"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </aside>

    <main class="app-main">
        <header class="app-header">
            <div>
                <h1 class="app-title">SkillTree</h1>
                <p id="skilltree-subtitulo" class="app-subtitle"></p>
            </div>

            <a class="usuario" href="perfil.html" title="Ver perfil">
                <span class="text-end">
                    <strong id="usuario-nome" class="usuario-nome"></strong>
                    <span id="usuario-cargo" class="usuario-cargo"></span>
                </span>
                <span id="usuario-iniciais" class="usuario-avatar"></span>
            </a>
        </header>

        <section class="card-np">
            <!-- A árvore é montada pelo skilltree.js: raiz (objetivo) → categorias → habilidades -->
            <div class="arvore-rolagem">
                <div class="arvore">
                    <a id="arvore-raiz" class="arvore-raiz" href="perfil.html" title="Editar objetivo"></a>
                    <div id="arvore-ramos" class="arvore-ramos"></div>
                </div>
            </div>

            <div id="arvore-vazia" class="estado-vazio py-4">
                Sua árvore ainda está vazia. Adicione habilidades para vê-la crescer.<br>
                <a class="btn-card d-inline-block mt-3" href="habilidades.html"><i class="bi bi-plus-lg"></i> Adicionar habilidades</a>
            </div>

            <div id="legenda" class="legenda"></div>
        </section>
    </main>

    <!-- Toast para avisos rápidos (usado pelo app.js) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">
            <div class="d-flex">
                <div id="toast-texto" class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/skilltree.js"></script>
</body>
</html>
